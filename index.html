<!DOCTYPE html>
<html>
<head>
  <title>SaaS Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; margin: 20px; }
    input, button { margin: 5px; padding: 8px; }
    .box { margin-bottom: 20px; }
  </style>
</head>

<body>

<h1>📊 SaaS Dashboard</h1>

<div class="box">
  <h2>Login</h2>
  <input id="loginName" placeholder="name">
  <input id="loginPass" type="password" placeholder="password">
  <button onclick="login()">Login</button>
</div>

<div class="box">
  <h2>Upload CSV</h2>
  <input type="file" id="file">
  <button onclick="upload()">Upload</button>
</div>

<div class="box">
  <h2>Stats</h2>
  <button onclick="loadStats()">Load chart</button>
  <canvas id="chart"></canvas>
</div>

<div id="kpis"></div>div>

<h3>👤 User: <span id="user"></span></h3>
  
<script>

const API = "https://data-analytics-saas.onrender.com";
let token = localStorage.getItem("token");

async function login() {
  const name = document.getElementById("loginName").value;
  const password = document.getElementById("loginPass").value;

  const res = await fetch(API + "/login", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({name, password})
  });

  const data = await res.json();
  token = data.token;

  alert("Logged in!");
}

  function authHeaders() {
  return {
    "Authorization": "Bearer " + token
  };
}
  
async function upload() {
  const file = document.getElementById("file").files[0];
  const form = new FormData();
  form.append("file", file);

  await fetch(API + "/upload", {
    method: "POST",
    headers: authHeaders(),
    body: form
  });

  alert("Uploaded!");
}

async function loadUser() {
  const res = await fetch(API + "/me", {
    headers: authHeaders()
  });
  const data = await res.json();

  document.getElementById("user").innerText = data.user;
}

async function loadStats() {
  const res = await fetch(API + "/stats", {
    headers: authHeaders()
  });

  const data = await res.json();
  token = data.token;

  localStorage.setItem("token", token);
  alert("Logged in!");

  new Chart(document.getElementById("chart"), {
    type: "bar",
    data: {
      labels: ["rows"],
      datasets: [{
        label: "Data count",
        data: [data.rows]
      }]
    }
  });
}

if (token) { 
  loadUser();
  loadStats();
  console.log("User already logged in");
}
  
function logout() {
  localStorage.removeItem("token");
  token = "";
  alert("Logged out");
}

function renderKPIs(rows) {
  document.getElementById("kpis").innerHTML =
    <h3> Total rows: ${rows}</h3>
  ;
}
  
</script>

</body>
</html>
