<!DOCTYPE html>
<html>
<head>
  <title>SaaS Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; margin: 20px; }
    input, button { margin: 5px; padding: 8px; }
    .box { margin-bottom: 20px; }
  </style>
</head>

<body>

<h1>📊 SaaS Dashboard</h1>

<div class="box">
  <h2>Login</h2>
  <input id="loginName" placeholder="name">
  <input id="loginPass" type="password" placeholder="password">
  <button onclick="login()">Login</button>
</div>

<div class="box">
  <h2>Upload CSV</h2>
  <input type="file" id="file">
  <button onclick="upload()">Upload</button>
</div>

<div class="box">
  <h2>Stats</h2>
  <button onclick="loadStats()">Load chart</button>
  <canvas id="chart"></canvas>
</div>

<div id="kpis"></div>

<h3>👤 User: <span id="user"></span></h3>
  
<script>

const API = "https://data-analytics-saas.onrender.com";
let token = localStorage.getItem("token");

async function login() {
  const name = document.getElementById("loginName").value;
  const password = document.getElementById("loginPass").value;

  const res = await fetch(API + "/login", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({name, password})
  });

  if (!res.ok) {
    alert("Login failed");
    return;
  }

  const data = await res.json();
  token = data.token;
  localStorage.setItem("token", token);

  alert("Logged in!");

  loadUser();
  loadStats();
}

  function authHeaders() {
    if (!token) return {};
  return {
    "Authorization": "Bearer " + token
  };
}
  
async function upload() {
  const file = document.getElementById("file").files[0];
  if (!file) {
    alert("Select file first");
    return;
  }
  
  const form = new FormData();
  form.append("file", file);

  const res = await fetch(API + "/upload", {
    method: "POST",
    headers: authHeaders(),
    body: form
  });

    if(!res.ok) {
    alert("Upload failed");
    return;
  }

  alert("Uploaded!");

  loadStats();   

}

async function loadUser() {
  if (!token) return;

  const res = await fetch(API + "/me", {
    headers: authHeaders()
  });

  if (!res.ok){
    alert("Failed to load user");
    return;
  }

  const data = await res.json();

  document.getElementById("user").innerText = data.user;

}

let chart;

async function loadStats() {
    if (!token) return;

  const res = await fetch(API + "/stats", {
    headers: authHeaders()
  });

  if (!res.ok) {
    alert("Failed to load stats");
    return;
  }

  const data = await res.json();

  renderKPIs(data.rows);

  if (chart) chart.destroy();

  chart = new Chart(document.getElementById("chart"), {
    type: "bar",
    data: {
      labels: ["rows"],
      datasets: [{
        label: "Data count",
        data: [data.rows]
      }]
    }
  });
}

if (token) { 
  console.log("User already logged in");

  loadUser();
  loadStats();
}


  
function logout() {
  localStorage.removeItem("token");
  token = "";
  alert("Logged out");
}

function renderKPIs(rows) {
  document.getElementById("kpis").innerHTML =
    `<h3>Total rows: ${rows}</h3>` ;
}
  
</script>

</body>
</html>
